name: Deploy and Run Update

on:
  push:
    branches:
      - main
      - kubernetes
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Dynamic Image Name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=${{ env.REGISTRY }}/${REPO_LOWER}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Dependency Images and Services
        shell: bash
        run: |
          set -euo pipefail
          RUNTIME_IMAGE="${IMAGE_NAME}/runtime-dependencies"
          BUILD_IMAGE="${IMAGE_NAME}/dashboard-build-dependencies"
          DEPENDENCY_HASH=$(sha256sum \
            safety/package.json \
            safety/package-lock.json \
            safety/docker/Dockerfile.dependencies \
            safety/docker/Dockerfile.dashboard-build-dependencies \
            | sha256sum | cut -c1-16)
          DEPENDENCY_TAG="deps-${DEPENDENCY_HASH}"

          if docker manifest inspect "${RUNTIME_IMAGE}:${DEPENDENCY_TAG}" > /dev/null 2>&1 &&
             docker manifest inspect "${BUILD_IMAGE}:${DEPENDENCY_TAG}" > /dev/null 2>&1; then
            echo "Pulling existing dependency images ${DEPENDENCY_TAG}."
            docker pull "${RUNTIME_IMAGE}:${DEPENDENCY_TAG}"
            docker pull "${BUILD_IMAGE}:${DEPENDENCY_TAG}"
          else
            echo "Building dependency images ${DEPENDENCY_TAG}."
            docker build \
              --pull \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              -f safety/docker/Dockerfile.dependencies \
              -t "${RUNTIME_IMAGE}:${DEPENDENCY_TAG}" \
              safety
            docker push "${RUNTIME_IMAGE}:${DEPENDENCY_TAG}"

            docker build \
              --pull \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              -f safety/docker/Dockerfile.dashboard-build-dependencies \
              -t "${BUILD_IMAGE}:${DEPENDENCY_TAG}" \
              safety
            docker push "${BUILD_IMAGE}:${DEPENDENCY_TAG}"
          fi

          build_and_push() {
            local service="$1"
            local dockerfile="$2"
            local image="${IMAGE_NAME}/${service}"
            local build_args=(--build-arg "RUNTIME_DEPS_IMAGE=${RUNTIME_IMAGE}:${DEPENDENCY_TAG}")
            local timestamp
            timestamp=$(date +%Y%m%d%H%M%S)

            if [[ "${service}" == "web-dashboard" ]]; then
              build_args+=(--build-arg "DASHBOARD_BUILD_DEPS_IMAGE=${BUILD_IMAGE}:${DEPENDENCY_TAG}")
            fi

            echo "--- Building ${image} ---"
            docker build \
              --build-arg BUILDKIT_INLINE_CACHE=1 \
              "${build_args[@]}" \
              -f "safety/docker/${dockerfile}" \
              -t "${image}:latest" \
              -t "${image}:${timestamp}" \
              safety

            docker push "${image}:latest"
            docker push "${image}:${timestamp}"
          }

          build_and_push web-dashboard Dockerfile.dashboard
          build_and_push vrchat-bot Dockerfile.vrchat
          build_and_push discord-bot Dockerfile.discord